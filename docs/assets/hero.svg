<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="agent-factory compiles a one-off request into a reusable pseudocode prompt blueprint, and optionally into one portable SKILL.md skill installed into Claude Code, Codex, Gemini CLI, Cursor, GitHub Copilot, OpenCode, and Hermes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#151b33"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d5dfc"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8b93b8"/>
    </marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1f2747" stroke-width="1"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;}
      .cap{fill:#8b93b8;font-size:13px;letter-spacing:1.6px;font-weight:600;}
      .flow{stroke:#8b93b8;stroke-width:2;fill:none;}
      .tag{fill:#a5b4fc;font-size:15px;}
      .note{fill:#64748b;font-size:15px;}
    </style>
  </defs>

  <rect width="1200" height="480" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="480" rx="18" fill="url(#grid)" opacity="0.6"/>

  <!-- input: the one-off request -->
  <text class="cap" x="60" y="132">ONE-OFF REQUEST</text>
  <rect x="60" y="148" width="300" height="104" rx="14" fill="#1b2240" stroke="#2e3866"/>
  <text x="82" y="186" fill="#e2e8f0" font-size="18">"Write me a prompt that</text>
  <text x="82" y="212" fill="#e2e8f0" font-size="18">audits my repo."</text>
  <text x="82" y="238" fill="#64748b" font-size="13">re-derived from scratch every time</text>

  <!-- the compiler -->
  <path class="flow" d="M366 200 H452" marker-end="url(#arrow)"/>
  <rect x="460" y="142" width="240" height="116" rx="16" fill="url(#core)"/>
  <text x="580" y="190" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">agent-factory</text>
  <text x="580" y="218" text-anchor="middle" fill="#e0e7ff" font-size="15">prompt compiler</text>
  <text x="580" y="240" text-anchor="middle" fill="#c7d2fe" font-size="13">compile, don't answer</text>

  <!-- output: the blueprint -->
  <path class="flow" d="M706 200 H782" marker-end="url(#arrow)"/>
  <text class="cap" x="790" y="52">REUSABLE BLUEPRINT</text>
  <rect x="790" y="66" width="350" height="350" rx="14" fill="#0f1529" stroke="#2e3866"/>
  <circle cx="812" cy="88" r="5" fill="#f87171"/>
  <circle cx="830" cy="88" r="5" fill="#fbbf24"/>
  <circle cx="848" cy="88" r="5" fill="#34d399"/>
  <g class="mono">
    <text class="tag" x="814" y="128">&lt;role&gt;</text>
    <text class="tag" x="814" y="156">&lt;goal&gt;</text>
    <text class="tag" x="814" y="184">&lt;context&gt;</text>
    <text class="tag" x="814" y="212">&lt;inputs&gt;</text>
    <text class="tag" x="814" y="240">&lt;task&gt;</text>
    <text class="tag" x="814" y="268">&lt;instructions&gt;</text>
    <text class="tag" x="814" y="296">&lt;constraints&gt;</text>
    <text class="tag" x="814" y="324">&lt;evaluation&gt;</text>
    <text class="tag" x="814" y="352">&lt;output_format&gt;</text>
    <text x="814" y="388" fill="#34d399" font-size="15">&lt;termination_condition&gt;</text>
    <text class="note" x="1000" y="128">identity</text>
    <text class="note" x="1000" y="156">outcomes</text>
    <text class="note" x="1000" y="240">steps</text>
    <text class="note" x="1000" y="324">self-check</text>
  </g>

  <!-- mode 2: persistent skill -->
  <text class="cap" x="60" y="324">MODE 2 · MAKE IT PERMANENT</text>
  <path class="flow" d="M580 264 V372 H372" marker-end="url(#arrow)"/>
  <rect x="60" y="342" width="148" height="60" rx="12" fill="#1b2240" stroke="#2e3866"/>
  <text x="134" y="369" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600" class="mono">SKILL.md</text>
  <text x="134" y="389" text-anchor="middle" fill="#8b93b8" font-size="12">one portable skill</text>
  <rect x="220" y="342" width="148" height="60" rx="12" fill="#1b2240" stroke="#2e3866"/>
  <text x="294" y="369" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="600" class="mono">install.sh</text>
  <text x="294" y="389" text-anchor="middle" fill="#8b93b8" font-size="12">7 harnesses</text>

  <text x="60" y="448" fill="#94a3b8" font-size="15">Same request in, same structured spec out: runnable by a person or any model, every time.</text>
</svg>
